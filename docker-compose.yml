services:
  postgres:
    image: postgres:16-alpine
    container_name: nihongo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nihongo
      POSTGRES_USER: nihongo
      POSTGRES_PASSWORD: nihongo
    ports:
      - "5432:5432"
    volumes:
      - nihongo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nihongo -d nihongo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nihongo_pg_data:
